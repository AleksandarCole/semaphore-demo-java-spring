version: v1.0
name: ☕ Java Spring CI Pipeline
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'maven:3.9.6-eclipse-temurin-17'
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  env_vars:
    - name: MAVEN_OPTS
      value: '-Dmaven.repo.local=.m2'
blocks:
  - name: "\U0001F3D7️ Build"
    task:
      jobs:
        - name: Build
          commands:
            - checkout
            - cache restore m2
            - 'mvn -q package jmeter:configure -Dmaven.test.skip=true'
            - cache store m2 ~/.m2
  - name: "\U0001F9EA Test"
    task:
      prologue:
        commands:
          - checkout
          - cache restore m2
          - mvn -q test-compile -Dmaven.test.skip=true
      jobs:
        - name: Unit tests
          commands:
            - mvn test
        - name: Integration tests
          commands:
            - mvn test -Pintegration-testing
  - name: ⚡ Performance tests
    task:
      prologue:
        commands:
          - checkout
          - cache restore m2
          - 'mvn -q package jmeter:configure -Dmaven.test.skip=true'
      jobs:
        - name: Benchmark
          commands:
            - java -version
            - java -jar target/spring-pipeline-demo.jar > /dev/null &
            - sleep 20
            - 'mvn -q jmeter:jmeter'
            - 'mvn jmeter:results'
